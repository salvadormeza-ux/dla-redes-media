<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Propuestas web PTC Mining</title>
<meta name="description" content="Tres propuestas de diseño para el nuevo sitio web de PTC Mining, preparadas por Informática DLA.">
<link rel="icon" type="image/svg+xml" href="assets/isotipo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Visor de propuestas — una barra de presentación y la propuesta a pantalla completa debajo */
:root{
  --bar:#0d1217;
  --bar-2:#161d24;
  --line:#26303a;
  --txt:#c9d2da;
  --mute:#7e8b96;
  --white:#ffffff;
  --or:#f2460c;
  --stage:#1a2027;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bar);color:var(--txt);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}

.bar{flex:none;display:flex;align-items:center;gap:20px;height:64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);box-sizing:content-box;background:var(--bar);border-bottom:1px solid var(--line);position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:14px;flex:none}
.brand img{height:34px;width:auto;display:block}
.brand span{font-size:13px;line-height:1.25;color:var(--mute);border-left:1px solid var(--line);padding-left:14px}
.brand span b{display:block;color:var(--white);font-weight:600;font-size:14px}

.tabs{flex:1;display:flex;justify-content:center;gap:6px;min-width:0}
.tab{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:8px;border:1px solid transparent;transition:background .2s,border-color .2s;white-space:nowrap}
.tab i{font-style:normal;font-family:var(--mono);font-size:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--mute);flex:none}
.tab b{font-weight:600;font-size:15px;color:var(--txt)}
.tab small{font-size:12px;color:var(--mute);display:block;margin-top:1px}
.tab:hover{background:var(--bar-2)}
.tab[aria-current="true"]{background:var(--bar-2);border-color:var(--line)}
.tab[aria-current="true"] i{background:var(--or);border-color:var(--or);color:#fff}
.tab[aria-current="true"] b{color:var(--white)}

.tools{flex:none;display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:5px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed="true"]{background:var(--bar-2);color:var(--white)}
.open{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:9px 12px;border-radius:8px;border:1px solid var(--line)}
.open:hover{border-color:var(--txt);color:var(--white)}
.open svg{width:14px;height:14px}
.info{font-size:13px;font-weight:600;padding:9px 12px;border-radius:8px;color:var(--mute)}
.pick{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;padding:10px 14px;border-radius:8px;background:var(--or);color:#fff;white-space:nowrap}
.pick:hover{background:#ff5a1f}
.pick svg{width:16px;height:16px}
.info:hover{color:var(--white)}

.stage{flex:1;position:relative;min-height:0;background:var(--stage);display:flex;justify-content:center;align-items:stretch}
.frame-wrap{position:relative;width:100%;height:100%;transition:width .35s ease,height .35s ease,margin .35s ease}
iframe{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#fff;visibility:hidden}
iframe.on{visibility:visible}
.stage.phone{align-items:center;padding-block:18px}
.stage.phone .frame-wrap{width:390px;height:min(800px,100%);border-radius:34px;overflow:hidden;box-shadow:0 0 0 10px #05080a,0 0 0 11px #2c3640,0 30px 60px rgba(0,0,0,.55)}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--mute);background:var(--stage);transition:opacity .3s;pointer-events:none}
.loading.done{opacity:0}

@media (max-width:1180px){.tab small{display:none}.brand span{display:none}}
@media (max-width:900px){
  .bar{flex-wrap:wrap;height:auto;padding-block:10px;gap:10px}
  .brand{order:1}
  .tools{order:2;margin-left:auto}
  .tabs{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .seg,.info{display:none}
}
@media (max-width:420px){.open span,.pick span{display:none}.tab{padding:8px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <a class="brand" href="resumen.html" aria-label="Resumen de las propuestas">
    <img src="assets/logo-blanco.svg" alt="PTC · Patagon Technologies Corp">
    <span><b>Propuestas sitio web</b>Informática DLA</span>
  </a>
  <nav class="tabs" aria-label="Propuestas">
    <a class="tab" href="#p1" data-p="1"><i>1</i><span><b>Corporativa</b><small>Clara y fotográfica</small></span></a>
    <a class="tab" href="#p2" data-p="2"><i>2</i><span><b>Ingeniería digital</b><small>Oscura con 3D</small></span></a>
    <a class="tab" href="#p3" data-p="3"><i>3</i><span><b>Catálogo técnico</b><small>Selector y calculadora</small></span></a>
  </nav>
  <div class="tools">
    <div class="seg" role="group" aria-label="Vista">
      <button id="v-desk" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Escritorio</button>
      <button id="v-phone" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>Celular</button>
    </div>
    <a class="info" href="resumen.html">Resumen</a>
    <a class="pick" id="pick" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Elegir esta propuesta</span></a>
    <a class="open" id="open" href="propuesta-1.html" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></svg><span>Pantalla completa</span></a>
  </div>
</header>

<main class="stage" id="stage">
  <div class="frame-wrap">
    <iframe id="f1" title="Propuesta 1: Corporativa" data-src="propuesta-1.html"></iframe>
    <iframe id="f2" title="Propuesta 2: Ingeniería digital" data-src="propuesta-2.html"></iframe>
    <iframe id="f3" title="Propuesta 3: Catálogo técnico" data-src="propuesta-3.html"></iframe>
    <div class="loading" id="loading">CARGANDO PROPUESTA…</div>
  </div>
</main>

<script>
const NAMES={'1':'Propuesta 1: Corporativa','2':'Propuesta 2: Ingeniería digital','3':'Propuesta 3: Catálogo técnico'};
const loading=document.getElementById('loading'),open=document.getElementById('open'),pick=document.getElementById('pick'),stage=document.getElementById('stage');
const tabs=[...document.querySelectorAll('.tab')];
const frames={'1':document.getElementById('f1'),'2':document.getElementById('f2'),'3':document.getElementById('f3')};
function load(n){const f=frames[n];if(!f.src){f.addEventListener('load',()=>{f.dataset.ready='1';if(f.classList.contains('on'))setTimeout(()=>loading.classList.add('done'),200)},{once:true});f.src=f.dataset.src}}
function show(n){
  if(!frames[n])n='1';
  tabs.forEach(t=>t.setAttribute('aria-current',t.dataset.p===n));
  Object.entries(frames).forEach(([k,f])=>f.classList.toggle('on',k===n));
  open.href=frames[n].dataset.src;
  pick.href='https://wa.me/56959578467?text='+encodeURIComponent('Hola Salvador, en PTC revisamos las propuestas del sitio web y elegimos la '+NAMES[n]+'.');
  load(n);
  loading.classList.toggle('done',frames[n].dataset.ready==='1');
  const t=tabs.find(t=>t.dataset.p===n);t&&t.scrollIntoView({inline:'center',block:'nearest'});
}
function fromHash(){const m=location.hash.match(/^#p([123])$/);show(m?m[1]:'1')}
addEventListener('hashchange',fromHash);fromHash();
// precargar las otras dos para que el cambio sea instantáneo
addEventListener('load',()=>setTimeout(()=>['1','2','3'].forEach(load),1200));
setTimeout(()=>loading.classList.add('done'),7000);
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;if(['1','2','3'].includes(e.key))location.hash='p'+e.key});
const vd=document.getElementById('v-desk'),vp=document.getElementById('v-phone');
function view(phone){stage.classList.toggle('phone',phone);vd.setAttribute('aria-pressed',!phone);vp.setAttribute('aria-pressed',phone)}
vd.onclick=()=>view(false);vp.onclick=()=>view(true);
</script>
</body>
</html>
